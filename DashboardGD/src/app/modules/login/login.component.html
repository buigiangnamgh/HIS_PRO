<div class="app-body" [formGroup]="loginForm">
  <main class="main d-flex align-items-center">
    <div class="container">
      <div class="row">
        <div class="col-md-5 mx-auto">
          <div class="card-group">
            <div class="card p-4">
              <div class="card-body">                
                <h6><b>{{ 'app.shorttitle' | translate }}</b></h6>
                <!-- <p class="text-muted">{{ 'login.form title' | translate }}</p> -->
                <div *ngIf="isShowDialog" class="alert alert-danger alert-dismissible">
                    {{dialogContent}}
                  </div>
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-user"></i></span>
                  </div>
                  <input type="text" class="form-control" formControlName="username" 
                  required placeholder="{{ 'login.username placeholder' | translate }}" [ngClass]="{'is-invalid': !loginForm.controls['username'].valid}"
                  (keydown.enter)="login(loginForm.value)" />
                </div>
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-lock"></i></span>
                  </div>
                  <input type="password" class="form-control" formControlName="password" 
                  required placeholder="{{ 'login.password placeholder' | translate }}" [ngClass]="{'is-invalid': !loginForm.controls['password'].valid}" (keydown.enter)="login(loginForm.value)" />
                </div>
                <div hidden class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="cui-globe icons"></i></span>
                  </div>
                  <select #langSelect (change)="this.translateService.use(langSelect.value)" class="form-control">
                    <!--<option *ngFor="let lang of translate.getLangs()" [value]="lang" [selected]="lang === translate.currentLang">{{ lang }}</option>-->
                    <option value='vi' [selected]="'vi' === this.translateService.currentLang">{{ 'app.lang vi' | translate }}</option>
                    <option value='en' [selected]="'en' === this.translateService.currentLang">{{ 'app.lang en' | translate }}</option>
                  </select>
                </div>                
                <!-- <br/> -->
                <div class="row">
                  <div class="col-8">
                    <button type="button" (click)="login(loginForm.value)" class="btn btn-primary px-4" [disabled]="isDisableLoginButton || !loginForm.valid">{{ 'login.submit button' | translate }}</button>
                  </div>
                  <div hidden class="col-4 text-right">
                    <button type="button" (click)="forgotpassword()" class="btn btn-link px-0">{{ 'login.forgot password' | translate }}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
